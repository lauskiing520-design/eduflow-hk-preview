<!doctype html>
<html lang="zh-Hant-HK"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>全班按題批改｜EduFlow HK</title><link rel="stylesheet" href="site.css?v=20261115-site1"><link rel="stylesheet" href="question-marking.css?v=6edb256bf9">
<script defer src="site-chrome.js?v=408defd1fe"></script><script defer src="assessment-data.js?v=989eb4385b"></script><script defer src="question-marking.js?v=8a1d4e73f2"></script>
</head><body data-site-page="marking"><div data-site-header-placeholder></div>
<main id="main-content" class="queue-page"><a href="schools.html#try">返回學校試用</a>
<header><h1>全班按題批改</h1><p>中一數學 · 三份虛構答卷。逐項評分後可直接改下一位學生的同一道題。試改記錄只存在這個瀏覽器。</p></header>
<nav class="queue-tools" aria-label="選題及作答"><label>批改題目<select id="question"></select></label><label>學生作答<select id="pupil"></select></label><span id="count"></span></nav>
<div class="queue-spread"><section class="script-side" aria-labelledby="prompt"><h2 id="prompt"></h2><img id="figure" alt="">
<h3 id="script-title" tabindex="-1"></h3><div id="working"></div></section>
<section class="rubric-side"><h2>評分準則</h2><details><summary>參考解法</summary><p id="solution"></p></details>
<form id="mark-form"><div id="points"></div><label for="feedback">給學生的評語（選填）</label><textarea id="feedback" rows="2" maxlength="400"></textarea>
<div class="score"><strong>本題得分</strong><output id="total"></output></div><button class="primary" id="save-next" type="submit">保存並改下一份</button></form></section></div>
<p role="status" id="queue-status" aria-live="polite"></p><section class="results" id="results" hidden><h2>本題評分記錄</h2><ul id="record-list"></ul></section>
</main><div data-site-footer-placeholder></div></body></html>
