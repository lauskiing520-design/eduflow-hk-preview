<html lang="zh-Hant-HK"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="site.css?v=20261115-site1"><link rel="stylesheet" href="paper-receipt.css?v=50beedee0b">
<script defer src="site-chrome.js?v=408defd1fe"></script><script defer src="assessment-data.js?v=26b209efa1"></script>
<script defer src="preview-preflight.js?v=93063562a2"></script>
<script defer src="vendor/qrcode-generator-1.4.4.js?v=18ae399f81"></script><script defer src="vendor/jsqr-1.4.0.js?v=bc40c8a151"></script>
<script defer src="equation-variants.js?v=123174819b"></script><script defer src="percentage-variants.js?v=7cdc233e5e"></script><script defer src="inquiry-variants.js?v=65920d44cd"></script><script defer src="assessment-maths-en.js?v=92b6b0193f"></script><link rel="stylesheet" href="maths-language.css?v=b2796a990f"><script defer src="maths-language.js?v=d84e0ed63c"></script><script defer src="question-bank.js?v=036e27b8cd"></script><script defer src="department-sample.js?v=8667754f1f"></script><script defer src="preview-question-bank.js?v=59b6791bcb"></script><script defer src="paper-receipt.js?v=55370b4d72"></script></head>
<body data-site-page="assessment"><div data-site-header-placeholder></div>
<main id="main-content" class="receipt"><a class="back" id="back" href="schools.html#try">返回學校試用</a>
<header><h1>紙卷收件</h1><p id="context">正在準備示例答題紙…</p></header>
<div id="tools" hidden><section class="issue" aria-labelledby="issue-heading"><div class="issue-controls">
<h2 id="issue-heading">列印答題紙</h2><p>每張答題紙印有學生代號、頁碼和專屬二維碼。請與試題一併派發。</p>
<label for="pupil">列印對象</label><select id="pupil"><option value="all">兩位示例學生</option></select>
<button type="button" id="print" class="primary">列印答題紙</button>
<p id="print-count" class="muted"></p></div>
<figure><img id="preview" alt="帶學生代號及二維碼的答題紙首頁"><figcaption id="caption"></figcaption></figure></section>
<section class="intake" aria-labelledby="intake-heading"><h2 id="intake-heading">核對收回的紙卷</h2>
<p>試收一疊次序已打亂的示例頁，其中一張的二維碼被遮住。也可以選取拍下的示例答題紙，每張相片只放一頁。</p>
<div class="actions"><button type="button" id="example" class="primary">試收打亂的示例頁</button>
<button type="button" id="choose">選取示例紙卷相片</button><button type="button" id="resume-photos" hidden>返回本分頁的相片收件</button><input type="file" id="images" accept="image/jpeg,image/png" multiple hidden></div>
<p class="muted">支援 JPG、PNG。相片及其收件記錄只在目前分頁使用。內置示例的進度會保存在此瀏覽器。</p>
<p id="message" role="status" aria-live="polite"></p>
<div id="review" hidden><h3 id="review-heading" tabindex="-1">逐頁核對</h3><div id="pages"></div><button type="button" id="skip-unknown" hidden>先略過未配對頁</button><p id="tally" aria-live="polite"></p><button id="confirm" type="button" class="primary">確認收件</button> <button type="button" id="cancel" hidden>取消這批補交</button></div>
<div id="finished" hidden><h3 tabindex="-1" id="finished-heading">已確認收件</h3><p id="receipt-summary"></p><ul id="bundles"></ul><div class="actions"><button type="button" id="photo-topup">選取補交相片</button><button id="revise" type="button">返回逐頁核對</button></div></div></section></div>
</main><div data-site-footer-placeholder></div><div id="print-sheets" aria-hidden="true"></div></body></html>
