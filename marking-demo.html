<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>試改一份答卷｜EduFlow HK</title>
<link rel="stylesheet" href="site.css?v=20261115-site1">
<link rel="stylesheet" href="marking-demo.css">
<script defer src="site-chrome.js?v=20261115-site1"></script><script defer src="marking-demo.js"></script>
</head>
<body data-site-page="assessment">
<div data-site-header-placeholder></div>
<main class="markdemo" id="main-content">
<a href="assessment.html#marking">返回老師改卷</a>
<header><p>中一數學 · 改卷示範</p><h1>試改一份答卷</h1><p>對照學生的解題步驟，調整分數與評語，再查看學生收到的結果。</p></header>
<p class="demo-note">虛構答卷及預設 AI 建議。操作只在此頁示範，重新整理會重設。</p>
<section id="teacherView" aria-label="教師覆核">
<div class="demo-columns">
<section class="manuscript" aria-labelledby="scriptTitle"><h2 id="scriptTitle">學生原稿 <small>模擬謄本</small></h2><p>示例學生 A · 第 1 題</p><h3>解方程 3(x − 2) = 12，寫出步驟。</h3><ol class="demo-lines">
<li id="line1">3x − 6 = 12</li><li id="line2">3x = 12 + 6 = 18</li><li id="line3">x = 9</li></ol></section>
<form id="reviewForm" class="scores"><div class="score-head"><h2>逐項覆核</h2><output id="total" aria-live="polite">2 / 3 分</output></div>
<p>點「對照原稿」查看每項建議引用的作答。</p>
<div id="rubric"></div>
<label for="feedback">給學生的評語</label><textarea rows="3" maxlength="800" id="feedback">展開括號及移項正確。最後一步要把等式兩邊除以 3，請再檢查 18 ÷ 3。</textarea>
<button type="submit" class="demo-primary">確認評分</button>
</form></div></section>
<section id="confirmed" hidden><h2 tabindex="-1">已確認示範評分</h2><p id="confirmedScore"></p><button type="button" class="demo-primary" id="studentButton">查看模擬學生結果</button> <button type="button" id="revise">返回修改評分</button></section>
<section id="studentView" hidden><h2 tabindex="-1">學生收到的評改</h2><p>示例學生 A · 一元一次方程</p><h3 id="studentScore"></h3><ul id="breakdown"></ul><h3>老師評語</h3><p id="studentFeedback"></p><button type="button" id="back">返回教師畫面</button></section>
</main><div data-site-footer-placeholder></div></body></html>
